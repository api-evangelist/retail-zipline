aid: retail-zipline
name: Retail Zipline
description: 'Retail Zipline, Inc. (branded "Zipline") is a San Francisco-based retail
  operations software company founded in 2014 by Melissa Wong and Jeremy Baker. Its
  cloud platform coordinates communications, task management, checklists, audits,
  learning, knowledge base and performance reporting across headquarters, field
  leaders and brick-and-mortar store teams, and is used by 130+ global retail brands
  including Sephora, Lush, Bath & Body Works and Warby Parker. The product is
  delivered as a multi-tenant Rails application on per-customer subdomains of
  retailzipline.com, with mobile apps for iOS and Android. Zipline publishes no
  public OpenAPI, GraphQL schema or developer portal; its integration surface is
  sold and provisioned through the vendor, while its marketing site publishes an
  OAuth-protected Model Context Protocol (MCP) endpoint discoverable through RFC
  8414 / RFC 9728 well-known metadata.'
