source: getzipline.com published security/compliance pages + probed /.well-known/ OAuth metadata
summary: >-
  Zipline has no public API contract, so cross-cutting API standards conformance
  is mostly not assertable. What IS assertable is its OAuth/MCP authorization
  posture, read from documents it serves itself, plus a published enterprise
  compliance program.
standards:
