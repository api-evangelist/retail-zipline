  conforms: true
  evidence: >-
    getzipline.com serves an authorization server with /oauth/authorize,
    /oauth/token and /oauth/revoke, advertising authorization_code and
    refresh_token grants.
  source: https://getzipline.com/.well-known/oauth-authorization-server
- id: rfc8414
